# ========
# Arquivo de automação de testes, compilação, versionamento e publicação.
# Valida testes automatizados e build antes de acionar o Release-It no Git,
# executando a publicação no NPM como passo final via Trusted Publishing (OIDC).
# ========
name: Release and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta

jobs:
  release:
    name: Release
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'fix:') || startsWith(github.event.head_commit.message, 'feat:') || startsWith(github.event.head_commit.message, 'perf:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test:run

      - name: Build Project
        run: npm run build

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Execute Git Release
        if: "github.event_name != 'workflow_dispatch'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx release-it --ci

      - name: Publish to NPM
        run: npm publish --provenance --access public